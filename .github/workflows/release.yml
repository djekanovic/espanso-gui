name: Release

# Builds Windows, macOS, and Linux packages natively on their own runners
# (electron-builder can't cross-compile a .dmg or reliably cross-compile
# Linux targets from Windows) and attaches them to a GitHub Release.
#
# Trigger a release by pushing a tag: `git tag v1.1.0 && git push origin v1.1.0`
# Or run it manually via the Actions tab (workflow_dispatch) to build
# without publishing a release - artifacts are still uploaded to the run.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run dist

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: espanso-gui-${{ matrix.os }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.zip
            release/*.AppImage
            release/*.deb
          if-no-files-found: ignore

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          body: |
            ## What's new

            - **Redesigned dashboard** — espanso control banner (Start/Stop/Restart), a highlighted **Add Snippet** shortcut that jumps straight into the snippet editor, quick-action tiles, live stats, Learn Espanso doc cards, and rotating usage tips
            - **Smoother snippets experience** — loading states instead of flashing empty screens, and extensions/forms now auto-save the moment you leave the tab (no more Save/Cancel)
            - **Better form field editor** — clean stacked layout (type → label → var name → default value), delete on its own row, multiline toggle at the bottom
            - **Fixed espanso discovery on macOS** — Homebrew and cask installs are now found automatically
            - **Subtler theme picker** and tighter dashboard spacing

            > Builds are unsigned — Windows SmartScreen and macOS Gatekeeper will warn on first launch.
          files: |
            release/*.exe
            release/*.dmg
            release/*.zip
            release/*.AppImage
            release/*.deb
